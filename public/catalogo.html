<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catálogo — Agro Market ULEAM</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head><body>
<nav class="navbar navbar-dark bg-success"><div class="container">
  <a class="navbar-brand fw-bold" href="catalogo.html">🌱 Agro Market ULEAM</a>
  <div class="d-flex flex-wrap align-items-center gap-3">
    <a class="text-white" href="mis-pedidos.html">Mis pedidos</a><a class="text-white" href="carrito.html">Carrito</a>
    <span id="usuario-nombre" class="text-white"></span><button type="button" class="btn btn-sm btn-outline-light" onclick="cerrarSesion()">Salir</button>
  </div>
</div></nav>
<main class="container py-4">
  <h1 class="h4 fw-bold text-success mb-4">Catálogo de productos</h1>
  <div class="row g-3 mb-3">
    <div class="col-md-6"><label for="busqueda" class="form-label">Buscar producto</label><input type="search" id="busqueda" class="form-control" placeholder="Nombre o descripción"></div>
    <div class="col-md-4"><label for="filtro-categoria" class="form-label">Categoría</label><select id="filtro-categoria" class="form-select"><option value="">Todas las categorías</option></select></div>
    <div class="col-md-2 d-flex align-items-end"><button type="button" id="actualizar-catalogo" class="btn btn-outline-success w-100">Actualizar</button></div>
  </div>
  <p class="text-muted small">Stock actualizado en vivo. Máximo 5 productos distintos por pedido.</p>
  <p id="resultado-filtro" class="text-muted small" role="status"></p>
  <div id="catalogo-error" class="alert alert-danger d-none" role="alert"></div>
  <div id="productos-grid" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3" aria-live="polite"><p>Cargando productos...</p></div>
</main>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/db.js"></script><script src="js/carrito.js"></script>
<script>
  let todosLosProductos = [];
  let categorias = [];
  let cargando = false;
  const productosAgregandose = new Set();
  function nodo(tag, clase = "", texto = "") { const el = document.createElement(tag); el.className = clase; el.textContent = texto; return el; }
  async function iniciarPagina() { await cargarNavbar(); await cargarCatalogo(); }
  let detenerCatalogo = null;
  function cerrarCatalogo() { detenerCatalogo?.(); detenerCatalogo = null; cargando = false; }
  function cargarCatalogo() {
    cerrarCatalogo();
    cargando = true;
    const boton = document.getElementById("actualizar-catalogo"); boton.disabled = true;
    const aviso = document.getElementById("catalogo-error"); aviso.classList.add("d-none");
    const fallar = error => {
      console.error("Error al escuchar el catálogo:", error);
      aviso.textContent = "No se pudo actualizar el catálogo. Revisa tu conexión y permisos y pulsa Actualizar.";
      aviso.classList.remove("d-none"); cargando = false; boton.disabled = false;
    };
    try {
      detenerCatalogo = escucharCatalogo((productos, nuevasCategorias) => {
        todosLosProductos = productos; categorias = nuevasCategorias;
        const selector = document.getElementById("filtro-categoria");
        const anterior = selector.value; selector.replaceChildren();
        for (const [valor,texto] of [["", "Todas las categorías"], ["__sin_categoria__", "Sin categoría"], ...categorias.filter(c => c.activo).map(c => [c.id,c.nombre])]) {
          const opcion = nodo("option", "", texto); opcion.value = valor; selector.append(opcion);
        }
        if ([...selector.options].some(opcion => opcion.value === anterior)) selector.value = anterior;
        filtrar(); cargando = false; boton.disabled = false;
      }, fallar);
    } catch (error) { fallar(error); }
  }
  window.addEventListener("pagehide", cerrarCatalogo);
  window.addEventListener("pageshow", evento => { if (evento.persisted && auth.currentUser) cargarCatalogo(); });
  function filtrar() {
    renderProductos(filtrarProductosCatalogo(todosLosProductos, document.getElementById("busqueda").value, document.getElementById("filtro-categoria").value));
  }
  function renderProductos(productos) {
    const grid = document.getElementById("productos-grid"); grid.replaceChildren();
    document.getElementById("resultado-filtro").textContent = `${productos.length} producto${productos.length === 1 ? "" : "s"}`;
    if (!productos.length) { grid.append(nodo("p", "text-muted", "No se encontraron productos.")); return; }
    const nombresCategorias = new Map(categorias.map(c => [c.id, c.nombre]));
    for (const p of productos) {
      const col = nodo("div", "col"); const tarjeta = nodo("article", "card h-100 shadow-sm border-0");
      const visual = nodo("div", "bg-light d-flex align-items-center justify-content-center rounded-top"); visual.style.height = "170px";
      const respaldo = () => { visual.replaceChildren(nodo("span", "fs-1", "🌿")); };
      if (esURLImagenCloudinaryValida(p.imagen_url)) {
        const imagen = document.createElement("img"); imagen.src = p.imagen_url; imagen.alt = p.nombre; imagen.loading = "lazy";
        imagen.className = "w-100 h-100 rounded-top"; imagen.style.objectFit = "cover";
        imagen.addEventListener("error", respaldo, { once: true }); visual.append(imagen);
      } else respaldo();
      const cuerpo = nodo("div", "card-body p-3");
      cuerpo.append(nodo("small", "text-muted", nombresCategorias.get(p.categoria_id) || "Sin categoría"), nodo("h2", "h6 fw-bold mt-1", p.nombre));
      if (p.descripcion) cuerpo.append(nodo("p", "small text-muted mb-2", p.descripcion));
      cuerpo.append(nodo("p", "text-success fw-bold mb-1", `${fmt(p.precio)} / ${p.unidad || "unidad"}`), nodo("small", "text-muted", `Stock: ${p.stock_actual ?? 0}`));
      const pie = nodo("div", "card-footer bg-white border-0 p-3 pt-0");
      const boton = nodo("button", `btn btn-${(p.stock_actual ?? 0) > 0 ? "success" : "secondary"} btn-sm w-100`, (p.stock_actual ?? 0) > 0 ? "Agregar al carrito" : "Sin stock");
      boton.type = "button"; boton.disabled = (p.stock_actual ?? 0) <= 0 || productosAgregandose.has(p.id);
      boton.addEventListener("click", () => agregarAlCarrito(p.id, boton));
      pie.append(boton); tarjeta.append(visual,cuerpo,pie); col.append(tarjeta); grid.append(col);
    }
  }
  async function agregarAlCarrito(id, boton) {
    if (productosAgregandose.has(id)) return;
    productosAgregandose.add(id); boton.disabled = true;
    try { const nombre = await agregarProductoAlCarrito(id); mostrarToast(`${nombre} agregado al carrito.`); }
    catch (error) { console.error(error); mostrarToast(error.code ? "No se pudo agregar el producto. Revisa tu conexión y permisos." : error.message, "danger"); }
    finally { productosAgregandose.delete(id); filtrar(); }
  }
  document.getElementById("busqueda").addEventListener("input", filtrar);
  document.getElementById("filtro-categoria").addEventListener("change", filtrar);
  document.getElementById("actualizar-catalogo").addEventListener("click", cargarCatalogo);
  protegerPagina(["cliente", "administrador"]);
</script>
</body></html>

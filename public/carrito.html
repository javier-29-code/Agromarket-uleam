<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito — Agro Market ULEAM</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <nav class="navbar navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand fw-bold" href="catalogo.html">
        Agro Market ULEAM
      </a>

      <div class="d-flex gap-3 align-items-center">
        <a href="catalogo.html" class="text-white">Catálogo</a>
        <span id="usuario-nombre" class="text-white"></span>
        <button type="button" class="btn btn-outline-light btn-sm"
                onclick="cerrarSesion()">
          Salir
        </button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h4 text-success mb-3">Mi carrito</h1>

    <div id="carrito-error" class="alert alert-danger d-none"
         role="alert"></div>

    <div id="carrito-contenido" class="table-responsive">
      Cargando carrito...
    </div>

    <div class="text-end mt-3">
      <p class="fs-5 fw-bold" id="carrito-total"></p>
    </div>

    <p class="text-muted small">
      Los precios y las existencias pueden cambiar.
      Agregar productos al carrito no reserva stock.
    </p>

    <a href="catalogo.html" class="btn btn-outline-success">
      Seguir comprando
    </a>

    <button type="button" id="btn-revisar-pedido" class="btn btn-success" disabled>
      Revisar pedido
    </button>
    <p id="carrito-limite" class="text-muted small mt-2"></p>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/carrito.js"></script>

  <script>
    let operacionCarritoEnCurso = false;

    async function iniciarPagina() {
      try {
        await cargarNavbar();
        await cargarVistaCarrito();
      } catch (error) {
        mostrarErrorCarrito(error);
      }
    }

    function mostrarErrorCarrito(error) {
      console.error("Error del carrito:", error);

      const aviso = document.getElementById("carrito-error");
      aviso.textContent = error.code
        ? "No se pudo completar la operación. Revisa tu conexión y permisos."
        : error.message;

      aviso.classList.remove("d-none");
    }

    async function cargarVistaCarrito() {
      const revisar = document.getElementById("btn-revisar-pedido");
      revisar.disabled = true;
      const carrito = obtenerCarrito();
      const limite = document.getElementById("carrito-limite");
      limite.textContent = carrito.length > LIMITES_COMPRA.productos
        ? `Hay ${carrito.length} productos distintos. Cada pedido admite ${LIMITES_COMPRA.productos}; quita los adicionales para continuar.`
        : `Cada pedido admite hasta ${LIMITES_COMPRA.productos} productos distintos.`;
      limite.className = carrito.length > LIMITES_COMPRA.productos ? "text-danger small mt-2" : "text-muted small mt-2";

      const productos = await Promise.all(
        carrito.map(item => obtenerProducto(item.productoId))
      );

      const contenido = document.getElementById("carrito-contenido");
      const totalElemento = document.getElementById("carrito-total");

      contenido.replaceChildren();
      totalElemento.textContent = "";

      if (!carrito.length) {
        contenido.textContent = "Tu carrito está vacío.";
        return;
      }

      const tabla = document.createElement("table");
      tabla.className = "table align-middle";

      const encabezado = tabla.createTHead().insertRow();

      ["Producto", "Precio", "Cantidad", "Subtotal", "Acciones"]
        .forEach(titulo => {
          const celda = document.createElement("th");
          celda.textContent = titulo;
          encabezado.appendChild(celda);
        });

      const cuerpo = tabla.createTBody();
      let totalCentavos = 0;
      let hayProblemas = carrito.length > LIMITES_COMPRA.productos;

      carrito.forEach((item, indice) => {
        const producto = productos[indice];
        const fila = cuerpo.insertRow();

        const precioValido =
          typeof producto?.precio === "number" &&
          Number.isFinite(producto.precio) &&
          producto.precio > 0;

        const disponible =
          producto?.activo === true &&
          precioValido &&
          typeof producto.stock_actual === "number" &&
          Number.isFinite(producto.stock_actual) &&
          producto.stock_actual >= item.cantidad && item.cantidad <= LIMITES_COMPRA.cantidadPorProducto;

        const nombreCelda = fila.insertCell();
        nombreCelda.textContent =
          producto?.nombre ?? "Producto eliminado";

        if (!disponible) {
          hayProblemas = true;

          const aviso = document.createElement("small");
          aviso.className = "d-block text-danger";
          aviso.textContent =
            "Producto no disponible o cantidad superior al stock.";

          nombreCelda.appendChild(aviso);
        }

        fila.insertCell().textContent = precioValido
          ? `${fmt(producto.precio)} / ${producto.unidad ?? "unidad"}`
          : "—";

        const cantidadCelda = fila.insertCell();
        const cantidad = document.createElement("input");

        cantidad.type = "number";
        cantidad.className = "form-control";
        cantidad.style.width = "100px";
        cantidad.min = "1";
        cantidad.step = "1";
        cantidad.max = String(Math.min(producto?.stock_actual ?? 0, LIMITES_COMPRA.cantidadPorProducto));
        cantidad.value = item.cantidad;
        cantidad.disabled = producto?.activo !== true;
        cantidad.setAttribute(
          "aria-label",
          `Cantidad de ${producto?.nombre ?? "producto"}`
        );

        cantidad.addEventListener("change", () =>
          ejecutarCambioCarrito(() =>
            cambiarCantidadCarrito(item.productoId, cantidad.value)
          )
        );

        cantidadCelda.appendChild(cantidad);

        const subtotalCentavos = precioValido
          ? Math.round(producto.precio * 100) * item.cantidad
          : 0;

        totalCentavos += subtotalCentavos;

        fila.insertCell().textContent = precioValido
          ? fmt(subtotalCentavos / 100)
          : "—";

        const acciones = fila.insertCell();
        const quitar = document.createElement("button");

        quitar.type = "button";
        quitar.className = "btn btn-outline-danger btn-sm";
        quitar.textContent = "Quitar";

        quitar.addEventListener("click", () =>
          ejecutarCambioCarrito(() =>
            quitarProductoCarrito(item.productoId)
          )
        );

        acciones.appendChild(quitar);
      });

      contenido.appendChild(tabla);
      revisar.disabled = hayProblemas;

      totalElemento.textContent =
        `${hayProblemas ? "Total provisional" : "Total de productos"}: ` +
        fmt(totalCentavos / 100);
    }

    async function ejecutarCambioCarrito(operacion) {
      if (operacionCarritoEnCurso) return;

      operacionCarritoEnCurso = true;

      document.getElementById("carrito-error").classList.add("d-none");

      document.querySelectorAll(
        "#carrito-contenido input, #carrito-contenido button"
      ).forEach(control => {
        control.disabled = true;
      });

      try {
        await operacion();
      } catch (error) {
        mostrarErrorCarrito(error);
      }

      try {
        await cargarVistaCarrito();
      } catch (error) {
        mostrarErrorCarrito(error);

        document.querySelectorAll(
          "#carrito-contenido input, #carrito-contenido button"
        ).forEach(control => {
          control.disabled = false;
        });
      } finally {
        operacionCarritoEnCurso = false;
      }
    }

    document.getElementById("btn-revisar-pedido").addEventListener("click", () => {
      if (!operacionCarritoEnCurso && !document.getElementById("btn-revisar-pedido").disabled) window.location.href = "checkout.html";
    });
    protegerPagina(["cliente", "administrador"]);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registro — Agro Market ULEAM</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head><body>
<div class="container" style="max-width:480px;margin-top:60px">
  <div class="card shadow-sm border-0 p-4">
    <h4 class="fw-bold text-success text-center mb-1">Crear cuenta</h4>
    <p class="text-center text-muted small mb-3">Solo estudiantes y docentes ULEAM</p>
    <div id="error-msg" class="alert alert-danger d-none"></div>
    <form id="form-registro"><div class="row g-2 mb-3">
      <div class="col-6">
        <label for="nombre" class="form-label">Nombre *</label>
        <input type="text" id="nombre" class="form-control" maxlength="100" required>
      </div>
      <div class="col-6">
        <label for="apellido" class="form-label">Apellido *</label>
        <input type="text" id="apellido" class="form-control" maxlength="100" required>
      </div>
    </div>
    <div class="mb-3">
      <label for="correo" class="form-label">Correo institucional *</label>
      <input type="email" id="correo" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña * (mínimo 6 caracteres)</label>
      <input type="password" id="password" class="form-control" minlength="6" required autocomplete="new-password">
    </div>
    <button class="btn btn-success w-100 fw-bold" type="submit" id="registrar">
      <i class="bi bi-person-plus"></i> Registrar / completar perfil
    </button>
    </form><hr>
    <p class="text-center mb-0 small">¿Ya tienes cuenta?
      <a href="login.html" class="text-success fw-bold">Inicia sesión</a></p>
  </div>
</div>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
<script>
  let registrando = false;
  document.getElementById("form-registro").addEventListener("submit", async evento => {
    evento.preventDefault(); if (registrando) return;
    const formulario = evento.currentTarget;
    const aviso = document.getElementById("error-msg");
    aviso.classList.add("d-none"); registrando = true;
    formulario.querySelectorAll("input,button").forEach(el => el.disabled = true);
    try {
      const datos = Object.fromEntries(["nombre","apellido","correo","password"].map(id => [id, document.getElementById(id).value]));
      const perfil = await registrarClienteSeguro(datos);
      window.location.href = crearModeloUsuario(perfil).obtenerPaginaInicio();
    } catch (error) {
      console.error("Error al registrar:", error);
      aviso.textContent = error.message; aviso.classList.remove("d-none");
    } finally {
      registrando = false;
      formulario.querySelectorAll("input,button").forEach(el => el.disabled = false);
    }
  });
</script>
</body></html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revisar pedido — Agro Market ULEAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <nav class="navbar navbar-dark bg-success">
    <div class="container">
      <a href="catalogo.html" class="navbar-brand fw-bold">Agro Market ULEAM</a>
      <a href="carrito.html" class="text-white">Volver al carrito</a>
    </div>
  </nav>
  <main class="container py-4">
    <h1 class="h4 text-success mb-3">Revisar pedido</h1>
    <div id="checkout-error" class="alert alert-danger d-none" role="alert"></div>
    <div id="checkout-cargando">Consultando precios y disponibilidad...</div>
    <section id="checkout-resumen" class="d-none">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead class="table-success"><tr><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Subtotal</th></tr></thead>
          <tbody id="checkout-detalles"></tbody>
        </table>
      </div>
      <fieldset id="datos-entrega" class="card mb-3">
        <div class="card-body">
          <legend class="h5">Entrega y pago</legend>
          <label for="tipo-entrega" class="form-label">Tipo de entrega</label>
          <select id="tipo-entrega" class="form-select mb-3">
            <option value="retiro">Retiro en Agro Market</option>
            <option value="delivery">Delivery en el campus</option>
          </select>
          <div id="campos-delivery" class="d-none">
            <label for="zona-delivery" class="form-label">Zona de entrega</label>
            <select id="zona-delivery" class="form-select mb-3"><option value="">Selecciona una zona</option></select>
            <p id="aviso-zonas" class="text-danger small d-none" role="status"></p>
            <div class="row g-3 mb-3">
              <div class="col-md-4"><label for="entrega-bloque" class="form-label">Bloque o edificio</label><input id="entrega-bloque" class="form-control" maxlength="80" placeholder="Ej.: Bloque A"></div>
              <div class="col-md-4"><label for="entrega-piso" class="form-label">Piso</label><input id="entrega-piso" class="form-control" maxlength="40" placeholder="Ej.: Planta baja"></div>
              <div class="col-md-4"><label for="entrega-aula" class="form-label">Aula u oficina</label><input id="entrega-aula" class="form-control" maxlength="80" placeholder="Ej.: Aula 101"></div>
            </div>
          </div>
          <p class="mb-0"><strong>Pago:</strong> efectivo <span id="pago-momento">al retirar</span>.</p>
        </div>
      </fieldset>
      <div class="mb-3">
        <label for="pedido-notas" class="form-label">Observaciones opcionales</label>
        <textarea id="pedido-notas" class="form-control" rows="2" maxlength="300"></textarea>
      </div>
      <div class="text-end" aria-live="polite">
        <p id="checkout-subtotal" class="mb-1"></p>
        <p id="checkout-envio" class="mb-1"></p>
        <p id="checkout-total" class="fs-5 fw-bold"></p>
      </div>
      <p class="text-muted small">Los precios, el stock y la tarifa de entrega se comprobarán nuevamente al confirmar.</p>
      <div class="d-flex justify-content-between">
        <a href="carrito.html" class="btn btn-outline-success">Modificar carrito</a>
        <button type="button" id="btn-confirmar-pedido" class="btn btn-success" disabled>Confirmar pedido</button>
      </div>
    </section>
  </main>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/carrito.js"></script>
  <script>
    let resumenPedido = null;
    let confirmandoPedido = false;
    let intentoCompra = null;
    let zonasDelivery = [];
    const pedidoConfirmacionId = db.collection("pedidos").doc().id;
    const porId = id => document.getElementById(id);

    function zonaSeleccionada() {
      return zonasDelivery.find(zona => zona.id === porId("zona-delivery").value);
    }

    function actualizarEntrega() {
      if (!resumenPedido) return;
      const delivery = porId("tipo-entrega").value === "delivery";
      const zona = zonaSeleccionada();
      porId("campos-delivery").classList.toggle("d-none", !delivery);
      porId("pago-momento").textContent = delivery ? "al recibir" : "al retirar";
      const subtotalCentavos = Math.round(resumenPedido.total * 100);
      const tarifaCentavos = delivery && zona ? Math.round(zona.tarifa * 100) : 0;
      porId("checkout-subtotal").textContent = `Productos: ${fmt(subtotalCentavos / 100)}`;
      porId("checkout-envio").textContent = delivery && !zona
        ? "Envío: selecciona una zona para calcular el total."
        : `Envío: ${fmt(tarifaCentavos / 100)}`;
      porId("checkout-total").textContent = delivery && !zona
        ? "Total: pendiente de seleccionar zona"
        : `Total: ${fmt((subtotalCentavos + tarifaCentavos) / 100)}`;
      porId("btn-confirmar-pedido").disabled = confirmandoPedido || (delivery && !zona);
    }

    async function iniciarPagina() {
      try {
        resumenPedido = await prepararResumenPedido();
        const cuerpo = porId("checkout-detalles");
        cuerpo.replaceChildren();
        resumenPedido.detalles.forEach(detalle => {
          const fila = cuerpo.insertRow();
          [detalle.nombre_producto, `${detalle.cantidad} ${detalle.unidad ?? "unidad"}`, fmt(detalle.precio_unitario), fmt(detalle.subtotal)]
            .forEach(valor => { fila.insertCell().textContent = valor; });
        });
        try {
          const zonas = await listarZonasDelivery();
          zonasDelivery = zonas.filter(zona => typeof zona.nombre === "string" && zona.nombre.trim() && zona.nombre.length <= 100 && typeof zona.tarifa === "number" && Number.isFinite(zona.tarifa) && zona.tarifa >= 0 && zona.tarifa <= 100);
          for (const zona of zonasDelivery) {
            const opcion = document.createElement("option");
            opcion.value = zona.id;
            opcion.textContent = `${zona.nombre} — ${fmt(Math.round(zona.tarifa * 100) / 100)}`;
            porId("zona-delivery").appendChild(opcion);
          }
          if (!zonasDelivery.length) throw new Error("No hay zonas de entrega disponibles.");
        } catch (error) {
          console.error("No se pudieron cargar las zonas:", error);
          porId("aviso-zonas").textContent = "No hay zonas disponibles o no se pudieron consultar. Puedes elegir retiro o recargar la página.";
          porId("aviso-zonas").classList.remove("d-none");
        }
        porId("checkout-resumen").classList.remove("d-none");
        actualizarEntrega();
      } catch (error) {
        console.error("Error al preparar el pedido:", error);
        porId("checkout-error").textContent = error.code
          ? "No se pudo consultar el pedido. Revisa tu conexión y permisos."
          : error.message;
        porId("checkout-error").classList.remove("d-none");
      } finally {
        porId("checkout-cargando").classList.add("d-none");
      }
    }

    function obtenerEntrega() {
      if (porId("tipo-entrega").value === "retiro") return { tipo: "retiro" };
      const zona = zonaSeleccionada();
      if (!zona) throw new Error("Selecciona una zona de entrega.");
      return validarEntregaCompra({
        tipo: "delivery", zona_id: zona.id,
        tarifa_centavos: Math.round(zona.tarifa * 100),
        bloque: porId("entrega-bloque").value,
        piso: porId("entrega-piso").value,
        aula: porId("entrega-aula").value
      });
    }

    async function confirmarPedido() {
      if (confirmandoPedido || !resumenPedido) return;
      const boton = porId("btn-confirmar-pedido");
      const notas = porId("pedido-notas");
      const aviso = porId("checkout-error");
      confirmandoPedido = true;
      boton.disabled = true;
      aviso.classList.add("d-none");
      let pedidoCreado = false;
      try {
        if (!intentoCompra) {
          const entrega = obtenerEntrega();
          intentoCompra = {
            carrito: resumenPedido.detalles.map(detalle => ({ productoId: detalle.producto_id, cantidad: detalle.cantidad })),
            notas: notas.value, entrega,
            clave: claveCarritoActual(),
            contenidoOriginal: JSON.stringify(obtenerCarrito())
          };
        }
        if (claveCarritoActual() !== intentoCompra.clave) throw new Error("La sesión cambió. Recarga la página.");
        notas.disabled = true;
        porId("datos-entrega").disabled = true;
        const pago = intentoCompra.entrega.tipo === "delivery"
          ? new PagoEfectivoDelivery() : new PagoEfectivoRetiro();
        const pedidoId = await crearPedidoCompra(
          intentoCompra.carrito, intentoCompra.notas, resumenPedido,
          pedidoConfirmacionId, pago, intentoCompra.entrega
        );
        pedidoCreado = true;
        let avisoCarrito = "";
        try {
          const actual = localStorage.getItem(intentoCompra.clave);
          if (actual === intentoCompra.contenidoOriginal || actual === null) localStorage.removeItem(intentoCompra.clave);
          else avisoCarrito = " El carrito cambió en otra pestaña y se conservó; revísalo.";
        } catch (error) {
          console.error("No se pudo limpiar el carrito:", error);
          avisoCarrito = " Revisa el carrito antes de realizar otra compra.";
        }
        porId("checkout-resumen").classList.add("d-none");
        const mensaje = document.createElement("div");
        mensaje.className = "alert alert-success";
        mensaje.setAttribute("role", "status");
        mensaje.textContent = `Pedido registrado: ${pedidoId}. Estado: pendiente.` + avisoCarrito;
        const enlace = document.createElement("a");
        enlace.href = "mis-pedidos.html";
        enlace.className = "btn btn-success";
        enlace.textContent = "Ver mis pedidos";
        document.querySelector("main").append(mensaje, enlace);
      } catch (error) {
        console.error("Error al confirmar el pedido:", error);
        aviso.textContent = error.code
          ? "No se pudo confirmar. Conserva esta página para reintentar y revisa la consola."
          : error.message;
        aviso.classList.remove("d-none");
      } finally {
        confirmandoPedido = false;
        if (!pedidoCreado) actualizarEntrega();
      }
    }
    porId("tipo-entrega").addEventListener("change", actualizarEntrega);
    porId("zona-delivery").addEventListener("change", actualizarEntrega);
    porId("btn-confirmar-pedido").addEventListener("click", confirmarPedido);
    protegerPagina(["cliente", "administrador"]);
  </script>
</body>
</html>

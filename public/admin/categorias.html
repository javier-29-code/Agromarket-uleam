<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Categorías — Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head><body>
<nav class="navbar navbar-dark bg-success"><div class="container-fluid gap-2"><a class="navbar-brand fw-bold" href="dashboard.html">Admin — Agro Market</a><div class="d-flex flex-wrap align-items-center gap-3"><a class="text-white" href="dashboard.html">Dashboard</a><a class="text-white" href="productos.html">Productos</a><a class="text-white" href="categorias.html" aria-current="page">Categorías</a><a class="text-white" href="pedidos.html">Pedidos</a><a class="text-white" href="usuarios.html">Usuarios</a><a class="text-white" href="zonas.html">Zonas</a><a class="text-white" href="../catalogo.html">Ver sitio</a><button type="button" class="btn btn-sm btn-outline-light" onclick="cerrarSesion()">Salir</button></div></div></nav>
<main class="container py-4">
  <h1 class="h4 text-success">Categorías</h1>
  <form id="form-categoria" class="card card-body my-3" style="max-width:600px">
    <h2 id="titulo-formulario" class="h5">Nueva categoría</h2>
    <label for="categoria-nombre" class="form-label">Nombre</label><input id="categoria-nombre" class="form-control" maxlength="100" required>
    <label class="my-3"><input id="categoria-activo" type="checkbox" class="form-check-input" checked> Activa para asignar a productos</label>
    <div class="d-flex gap-2"><button type="submit" class="btn btn-success">Guardar</button><button id="cancelar-edicion" type="button" class="btn btn-outline-secondary">Limpiar</button></div>
  </form>
  <div class="d-flex justify-content-between align-items-center"><h2 class="h5">Categorías registradas</h2><button id="actualizar" type="button" class="btn btn-outline-success btn-sm">Actualizar</button></div>
  <p class="text-muted small">Desactivar una categoría impide nuevas asignaciones. Los productos existentes se conservan.</p>
  <div id="lista-categorias" class="table-responsive" aria-live="polite">Cargando categorías...</div>
</main>
<script src="../js/firebase-config.js"></script><script src="../js/auth.js"></script><script src="../js/db.js"></script>
<script>
  let categoriaEnEdicion = null;
  let ocupado = false;
  function limpiarCategoria() { categoriaEnEdicion = null; document.getElementById("form-categoria").reset(); document.getElementById("titulo-formulario").textContent = "Nueva categoría"; }
  function bloquear(valor) { document.querySelectorAll("main input, main button").forEach(el => { el.disabled = valor; }); }
  async function iniciarPagina() { await cargarCategorias(); }
  async function cargarCategorias() {
    if (ocupado) return; ocupado = true; bloquear(true);
    const lista = document.getElementById("lista-categorias");
    try {
      const categorias = await listarCategorias(); lista.replaceChildren();
      if (!categorias.length) { lista.textContent = "No hay categorías. Crea la primera con el formulario."; return; }
      const tabla = document.createElement("table"); tabla.className = "table align-middle";
      const encabezado = tabla.createTHead().insertRow();
      for (const texto of ["Nombre", "Estado", "Acciones"]) { const celda = document.createElement("th"); celda.textContent = texto; encabezado.append(celda); }
      const cuerpo = tabla.createTBody();
      for (const categoria of categorias) {
        const fila = cuerpo.insertRow(); fila.insertCell().textContent = categoria.nombre; fila.insertCell().textContent = categoria.activo ? "Activa" : "Inactiva";
        const acciones = fila.insertCell();
        const editar = document.createElement("button"); editar.type = "button"; editar.className = "btn btn-outline-primary btn-sm me-2"; editar.textContent = "Editar";
        editar.addEventListener("click", () => {
          categoriaEnEdicion = categoria.id; document.getElementById("categoria-nombre").value = categoria.nombre;
          document.getElementById("categoria-activo").checked = categoria.activo === true;
          document.getElementById("titulo-formulario").textContent = "Editar categoría"; document.getElementById("categoria-nombre").focus();
        });
        const alternar = document.createElement("button"); alternar.type = "button"; alternar.className = "btn btn-outline-secondary btn-sm"; alternar.textContent = categoria.activo ? "Desactivar" : "Reactivar";
        alternar.addEventListener("click", () => ejecutar(() => cambiarCategoriaActiva(categoria.id, !categoria.activo)));
        acciones.append(editar,alternar);
      }
      lista.append(tabla);
    } catch (error) { console.error(error); lista.textContent = "No se pudieron cargar las categorías. Revisa la consola y pulsa Actualizar."; }
    finally { ocupado = false; bloquear(false); }
  }
  async function ejecutar(operacion) {
    if (ocupado) return; ocupado = true; bloquear(true);
    try { await operacion(); mostrarToast("Categoría guardada."); limpiarCategoria(); }
    catch (error) { console.error(error); mostrarToast(error.code ? "No se pudo guardar. Revisa tus permisos y conexión." : error.message, "danger"); }
    finally { ocupado = false; bloquear(false); await cargarCategorias(); }
  }
  document.getElementById("form-categoria").addEventListener("submit", evento => {
    evento.preventDefault(); const nombre = document.getElementById("categoria-nombre").value; const activo = document.getElementById("categoria-activo").checked;
    ejecutar(() => guardarCategoria(categoriaEnEdicion, nombre, activo));
  });
  document.getElementById("cancelar-edicion").addEventListener("click", limpiarCategoria);
  document.getElementById("actualizar").addEventListener("click", cargarCategorias);
  protegerPagina(["administrador"]);
</script>
</body></html>

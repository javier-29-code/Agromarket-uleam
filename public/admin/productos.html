<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Productos — Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
</head><body>
<nav class="navbar navbar-dark" style="background-color:#1B5E20">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="dashboard.html">⚙️ Admin — Agro Market</a>
    <div class="navbar-nav flex-row gap-3">
      <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
      <a class="nav-link text-white" href="productos.html">Productos</a>
      <a class="nav-link text-white" href="pedidos.html">Pedidos</a>
      <a class="nav-link text-white" href="categorias.html">Categorías</a>
      <a class="nav-link text-white" href="zonas.html">Zonas</a>
      <a class="nav-link text-white" href="../catalogo.html">Ver sitio</a>
      <a class="nav-link text-white" href="#" onclick="cerrarSesion()">Salir</a>
    </div>
  </div>
</nav>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-success mb-0">🌿 Productos</h4>
    <button 
    class="btn btn-success"
    data-bs-toggle="modal"
    data-bs-target="#modalNuevo"
    onclick="prepararNuevoProducto()">
    <i class="bi bi-plus-lg"></i> Nuevo producto
    </button>
  </div>
  <div class="card shadow-sm border-0">
    <div id="tabla-productos">
      <div class="p-4 text-center"><div class="spinner-border text-success"></div></div>
    </div>
  </div>
</div>

<!-- Modal nuevo producto -->
<div class="modal fade" id="modalNuevo" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header bg-success text-white">
      <h5 class="modal-title">Nuevo Producto</h5>
      <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
      <div class="mb-3">
        <label class="form-label">Nombre *</label>
        <input type="text" id="np-nombre" class="form-control">
      </div>
      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="form-label">Precio *</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" id="np-precio" class="form-control" step="0.01" min="0">
          </div>
        </div>
        <div class="col-6">
          <label class="form-label">Unidad</label>
          <select id="np-unidad" class="form-select">
            <option value="unidad">Unidad</option>
            <option value="kg">Kilogramo (kg)</option>
            <option value="lb">Libra (lb)</option>
            <option value="manojo">Manojo</option>
            <option value="docena">Docena</option>
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Stock inicial</label>
        <input type="number" id="np-stock" class="form-control" value="0" min="0">
      </div>
      <div class="mb-3">
        <label for="np-categoria" class="form-label">Categoría</label>
        <select id="np-categoria" class="form-select"><option value="">Sin categoría</option></select>
      </div>
      <div class="mb-3">
        <label for="np-imagen" class="form-label">Foto del producto (opcional)</label>
        <input id="np-imagen" type="file" class="form-control" accept="image/jpeg,image/png">
        <div class="form-text">JPG o PNG, hasta 5 MB.</div>
        <img id="np-preview" class="d-none mt-2 rounded" alt="Vista previa del producto" style="width:160px;height:120px;object-fit:contain">
        <label class="d-block mt-2"><input type="checkbox" id="np-quitar-imagen"> Quitar la imagen actual</label>
        <p id="np-progreso" class="small text-success mt-2" role="status"></p>
      </div>
      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea id="np-desc" class="form-control" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      <button class="btn btn-success" onclick="guardarProducto()">Guardar</button>
    </div>
  </div></div>
</div>

<!-- Formulario de movimiento de stock -->
<div class="modal fade" id="modalStock" tabindex="-1"
     aria-labelledby="titulo-modal-stock" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="titulo-modal-stock">
          Movimiento de stock
        </h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <form id="form-stock">
        <div class="modal-body">
          <p class="fw-bold mb-1" id="stock-producto-nombre"></p>
          <p class="text-muted" id="stock-producto-disponible"></p>

          <div class="mb-3">
            <label for="stock-tipo" class="form-label">Tipo</label>
            <select id="stock-tipo" class="form-select" required>
              <option value="entrada">Entrada: aumentar existencias</option>
              <option value="salida">Salida: reducir existencias</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="stock-cantidad" class="form-label">Cantidad</label>
            <input type="number" id="stock-cantidad"
                   class="form-control"
                   min="0.001" step="0.001" required>
          </div>

          <div class="mb-3">
            <label for="stock-motivo" class="form-label">Motivo</label>
            <textarea id="stock-motivo" class="form-control"
                      rows="2" maxlength="300" required></textarea>
          </div>

          <div id="stock-error" class="alert alert-danger d-none"
               role="alert"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary"
                  data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-success"
                  id="btn-guardar-stock">
            Registrar movimiento
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="modalHistorialStock" tabindex="-1"
     aria-labelledby="titulo-historial-stock" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="titulo-historial-stock">
          Historial de stock
        </h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <p id="historial-producto-nombre" class="fw-bold"></p>
        <div id="historial-stock-contenido" class="table-responsive"></div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary"
                data-bs-dismiss="modal">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/db.js"></script>
<script>

  let productoEnEdicion = null;
  let nuevoProductoId = null;
  let categoriasProducto = [];
  let imagenActual = null;
  let archivoSubido = null;
  let vistaTemporal = null;
  let guardandoProducto = false;

function cargarSelectorCategorias(actual = "") {
  const selector = document.getElementById("np-categoria");
  selector.replaceChildren();
  const vacia = document.createElement("option"); vacia.value = ""; vacia.textContent = "Sin categoría"; selector.append(vacia);
  categoriasProducto.filter(c => c.activo || c.id === actual).forEach(c => {
    const opcion = document.createElement("option"); opcion.value = c.id;
    opcion.textContent = c.nombre + (c.activo ? "" : " (inactiva)"); selector.append(opcion);
  });
  selector.value = actual;
}

function mostrarPreview(url) {
  const imagen = document.getElementById("np-preview");
  if (vistaTemporal) { URL.revokeObjectURL(vistaTemporal); vistaTemporal = null; }
  if (url) { imagen.src = url; imagen.classList.remove("d-none"); }
  else { imagen.removeAttribute("src"); imagen.classList.add("d-none"); }
}

document.getElementById("np-imagen").addEventListener("change", () => {
  archivoSubido = null;
  document.getElementById("np-quitar-imagen").checked = false;
  const archivo = document.getElementById("np-imagen").files[0];
  mostrarPreview(null);
  if (archivo) { vistaTemporal = URL.createObjectURL(archivo); document.getElementById("np-preview").src = vistaTemporal; document.getElementById("np-preview").classList.remove("d-none"); }
  else mostrarPreview(imagenActual?.imagen_url);
});
document.getElementById("np-quitar-imagen").addEventListener("change", evento => {
  if (evento.target.checked) { document.getElementById("np-imagen").value = ""; archivoSubido = null; mostrarPreview(null); }
  else mostrarPreview(imagenActual?.imagen_url);
});
document.getElementById("modalNuevo").addEventListener("hide.bs.modal", evento => {
  if (guardandoProducto) evento.preventDefault();
});

function prepararNuevoProducto() {
  productoEnEdicion = null;
  nuevoProductoId = generarIdProducto();
  imagenActual = null; archivoSubido = null;
  document.getElementById("np-imagen").value = "";
  document.getElementById("np-quitar-imagen").checked = false;
  document.getElementById("np-progreso").textContent = "";
  mostrarPreview(null);
  cargarSelectorCategorias();

  document.querySelector("#modalNuevo .modal-title").textContent =
    "Nuevo producto";

  document.getElementById("np-nombre").value = "";
  document.getElementById("np-precio").value = "";
  document.getElementById("np-unidad").value = "unidad";
  document.getElementById("np-stock").value = "0";
  document.getElementById("np-stock").disabled = false;
  document.getElementById("np-desc").value = "";
}

async function editarProducto(id) {
  try {
    const producto = await obtenerProducto(id);

    if (!producto) {
      throw new Error("El producto ya no existe.");
    }

    prepararNuevoProducto();
    productoEnEdicion = id;
    cargarSelectorCategorias(producto.categoria_id || "");
    imagenActual = producto.imagen_url ? { imagen_url: producto.imagen_url, imagen_public_id: producto.imagen_public_id ?? null } : null;
    mostrarPreview(esURLImagenCloudinaryValida(producto.imagen_url) ? producto.imagen_url : null);

    document.querySelector("#modalNuevo .modal-title").textContent =
      "Editar producto";

    document.getElementById("np-nombre").value = producto.nombre;
    document.getElementById("np-precio").value = producto.precio;
    document.getElementById("np-unidad").value = producto.unidad;
    document.getElementById("np-desc").value =
      producto.descripcion ?? "";

    document.getElementById("np-stock").value =
      producto.stock_actual ?? 0;
    document.getElementById("np-stock").disabled = true;

    bootstrap.Modal.getOrCreateInstance(
      document.getElementById("modalNuevo")
    ).show();
  } catch (error) {
    console.error("Error al abrir el producto:", error);
    mostrarToast("No se pudo abrir el producto para editar.", "danger");
  }
}

  protegerPagina(["administrador"]);

  async function iniciarPagina() {
    await cargarNavbar();
    categoriasProducto = await listarCategorias();
    await cargarProductos();
  }

  async function cargarProductos() {
    const [prods, categorias] = await Promise.all([listarProductosAdmin(), listarCategorias()]);
    categoriasProducto = categorias;
    const el = document.getElementById("tabla-productos");

    if (!prods.length) {
      el.innerHTML = `<p class="text-center text-muted p-4">
        No hay productos. Agrega el primero.</p>`;
      return;
    }

    el.replaceChildren();
    const tabla = document.createElement("table"); tabla.className = "table mb-0 align-middle";
    const cabecera = tabla.createTHead().insertRow();
    ["Producto", "Categoría", "Precio", "Stock", "Estado", "Acciones"].forEach(texto => {
      const th = document.createElement("th"); th.textContent = texto; cabecera.append(th);
    });
    const cuerpo = tabla.createTBody();
    const nombresCategorias = new Map(categoriasProducto.map(c => [c.id, c.nombre]));
    for (const p of prods) {
      const fila = cuerpo.insertRow();
      const informacion = fila.insertCell();
      if (esURLImagenCloudinaryValida(p.imagen_url)) {
        const foto = document.createElement("img"); foto.src = p.imagen_url; foto.alt = p.nombre; foto.loading = "lazy";
        foto.style.cssText = "width:64px;height:48px;object-fit:cover;border-radius:6px;margin-right:8px";
        foto.addEventListener("error", () => foto.remove(), { once: true }); informacion.append(foto);
      }
      const nombre = document.createElement("div"); nombre.className = "fw-semibold"; nombre.textContent = p.nombre;
      const descripcion = document.createElement("small"); descripcion.className = "text-muted"; descripcion.textContent = p.descripcion || "";
      informacion.append(nombre, descripcion);
      fila.insertCell().textContent = nombresCategorias.get(p.categoria_id) || "Sin categoría";
      fila.insertCell().textContent = `${fmt(p.precio)} /${p.unidad}`;
      fila.insertCell().textContent = p.stock_actual ?? 0;
      fila.insertCell().textContent = p.activo ? "Activo" : "Inactivo";
      const acciones = fila.insertCell();
      for (const [texto, clase, accion] of [
        [p.activo ? "Desactivar" : "Reactivar", p.activo ? "danger" : "success", boton => cambiarVisibilidadProducto(p.id, !p.activo, boton)],
        ["Editar", "primary", () => editarProducto(p.id)],
        ["Stock", "secondary", () => abrirMovimientoStock(p.id)],
        ["Historial", "info", () => abrirHistorialStock(p.id)]
      ]) {
        const boton = document.createElement("button"); boton.type = "button";
        boton.className = `btn btn-sm btn-outline-${clase} m-1`; boton.textContent = texto;
        boton.addEventListener("click", () => accion(boton)); acciones.append(boton);
      }
    }
    const envoltura = document.createElement("div"); envoltura.className = "table-responsive"; envoltura.append(tabla); el.append(envoltura);
  }


  async function cambiarVisibilidadProducto(id, activo, boton) {
  boton.disabled = true;

  try {
    await cambiarEstadoActivoProducto(id, activo);
    await cargarProductos();

    mostrarToast(
      activo ? "Producto reactivado." : "Producto desactivado."
    );
  } catch (error) {
    console.error("Error al cambiar el estado del producto:", error);
    mostrarToast("No se pudo cambiar el estado.", "danger");
  } finally {
    boton.disabled = false;
  }
}

async function guardarProducto() {
  if (guardandoProducto) return;
  guardandoProducto = true;
  const modal = document.getElementById("modalNuevo");
  modal.querySelectorAll("input, select, textarea, button").forEach(el => { el.disabled = true; });
  const progreso = document.getElementById("np-progreso");
  let guardado = false;
  const editando = productoEnEdicion !== null;
  try {
    const datos = {
      nombre: document.getElementById("np-nombre").value,
      precio: document.getElementById("np-precio").value,
      unidad: document.getElementById("np-unidad").value,
      descripcion: document.getElementById("np-desc").value,
      categoria_id: document.getElementById("np-categoria").value || null,
      imagen_url: null, imagen_public_id: null
    };
    const archivo = document.getElementById("np-imagen").files[0];
    if (!archivo && !document.getElementById("np-quitar-imagen").checked && imagenActual) Object.assign(datos, imagenActual);
    validarDatosProducto(datos);
    const stockTexto = document.getElementById("np-stock").value;
    if (!editando && (!stockTexto.trim() || !Number.isFinite(Number(stockTexto)) || Number(stockTexto) < 0)) throw new Error("Ingresa un stock inicial válido.");
    if (archivo) {
      progreso.textContent = "Subiendo imagen...";
      if (!archivoSubido || archivoSubido.archivo !== archivo) archivoSubido = { archivo, datos: await subirImagenProducto(archivo) };
      datos.imagen_url = archivoSubido.datos.imagen_url;
      datos.imagen_public_id = archivoSubido.datos.imagen_public_id;
    }
    progreso.textContent = "Guardando producto...";
    if (editando) await actualizarProducto(productoEnEdicion, datos);
    else await crearProducto({ ...datos, stock_actual: Number(stockTexto) }, nuevoProductoId);
    guardado = true;
  } catch (error) {
    console.error("Error al guardar el producto:", error);
    mostrarToast(error.code ? "No se pudo guardar. Revisa tu conexión y permisos." : error.message, "danger");
  } finally {
    guardandoProducto = false;
    modal.querySelectorAll("input, select, textarea, button").forEach(el => { el.disabled = false; });
    document.getElementById("np-stock").disabled = editando;
    progreso.textContent = "";
  }
  if (!guardado) return;
  bootstrap.Modal.getInstance(modal).hide();
  prepararNuevoProducto();
  mostrarToast(editando ? "Producto actualizado." : "Producto creado.");
  try { await cargarProductos(); }
  catch (error) { console.error(error); mostrarToast("Se guardó el producto. Recarga para actualizar la tabla.", "warning"); }
}

let productoStockId = null;
let guardandoStock = false;

async function abrirMovimientoStock(id) {
  try {
    const producto = await obtenerProducto(id);

    if (!producto) {
      throw new Error("El producto ya no existe.");
    }

    productoStockId = id;

    document.getElementById("form-stock").reset();

    const error = document.getElementById("stock-error");
    error.textContent = "";
    error.classList.add("d-none");

    document.getElementById("stock-producto-nombre").textContent =
      producto.nombre;

    document.getElementById("stock-producto-disponible").textContent =
      `Disponible: ${producto.stock_actual ?? 0} ${producto.unidad}`;

    bootstrap.Modal.getOrCreateInstance(
      document.getElementById("modalStock")
    ).show();
  } catch (error) {
    console.error("Error al abrir el movimiento:", error);
    mostrarToast("No se pudo cargar el producto.", "danger");
  }
}

document.getElementById("form-stock").addEventListener(
  "submit",
  guardarMovimientoStock
);

// Evitar cerrar el formulario mientras se está guardando.
document.getElementById("modalStock").addEventListener(
  "hide.bs.modal",
  evento => {
    if (guardandoStock) {
      evento.preventDefault();
    }
  }
);

async function guardarMovimientoStock(evento) {
  evento.preventDefault();

  if (guardandoStock || !productoStockId) return;

  const boton = document.getElementById("btn-guardar-stock");
  const errorVisible = document.getElementById("stock-error");

  guardandoStock = true;
  boton.disabled = true;
  errorVisible.classList.add("d-none");

  let nuevoStock;

  try {
    nuevoStock = await registrarMovimientoStock(
      productoStockId,
      document.getElementById("stock-tipo").value,
      document.getElementById("stock-cantidad").value,
      document.getElementById("stock-motivo").value
    );
  } catch (error) {
    console.error("Error al registrar el movimiento:", error);

    errorVisible.textContent = error.code
      ? "No se pudo guardar. Revisa tu conexión y tus permisos."
      : error.message;

    errorVisible.classList.remove("d-none");
    return;
  } finally {
    guardandoStock = false;
    boton.disabled = false;
  }

  bootstrap.Modal.getInstance(
    document.getElementById("modalStock")
  ).hide();

  productoStockId = null;

  mostrarToast(`Movimiento registrado. Nuevo stock: ${nuevoStock}.`);

  try {
    await cargarProductos();
  } catch (error) {
    console.error("Error al actualizar la tabla:", error);
    mostrarToast(
      "El movimiento se guardó. Recarga para ver el nuevo stock.",
      "warning"
    );
  }
}

let solicitudHistorial = 0;

async function abrirHistorialStock(productoId) {
  const solicitudActual = ++solicitudHistorial;
  const contenido = document.getElementById("historial-stock-contenido");
  const nombre = document.getElementById("historial-producto-nombre");

  nombre.textContent = "";
  contenido.textContent = "Cargando movimientos...";

  bootstrap.Modal.getOrCreateInstance(
    document.getElementById("modalHistorialStock")
  ).show();

  try {
    const [producto, movimientos] = await Promise.all([
      obtenerProducto(productoId),
      listarMovimientosProducto(productoId)
    ]);

    // Evitar mostrar una respuesta anterior si se abrió otro producto.
    if (solicitudActual !== solicitudHistorial) return;

    nombre.textContent = producto?.nombre ?? "Producto no disponible";
    mostrarHistorialStock(movimientos);
  } catch (error) {
    if (solicitudActual !== solicitudHistorial) return;

    console.error("Error al cargar el historial:", error);
    contenido.textContent = "No se pudo cargar el historial.";
  }
}

function mostrarHistorialStock(movimientos) {
  const contenido = document.getElementById("historial-stock-contenido");
  contenido.replaceChildren();

  if (!movimientos.length) {
    contenido.textContent = "Este producto todavía no tiene movimientos.";
    return;
  }

  const tabla = document.createElement("table");
  tabla.className = "table table-sm align-middle";

  const encabezado = tabla.createTHead().insertRow();

  ["Fecha", "Tipo", "Cantidad", "Anterior", "Nuevo", "Motivo"]
    .forEach(titulo => {
      const celda = document.createElement("th");
      celda.textContent = titulo;
      encabezado.appendChild(celda);
    });

  const cuerpo = tabla.createTBody();

  movimientos.forEach(movimiento => {
    const fila = cuerpo.insertRow();

    const fecha = movimiento.created_at?.toDate().toLocaleString(
      "es-EC",
      { timeZone: "America/Guayaquil" }
    ) ?? "Fecha pendiente";

    const valores = [
      fecha,
      movimiento.tipo === "entrada" ? "Entrada" : "Salida",
      movimiento.cantidad,
      movimiento.stock_anterior,
      movimiento.stock_nuevo,
      movimiento.motivo
    ];

    valores.forEach(valor => {
      fila.insertCell().textContent = String(valor ?? "");
    });
  });

  contenido.appendChild(tabla);
}

</script>
</body></html>

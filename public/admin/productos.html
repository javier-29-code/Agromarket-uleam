<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Productos — Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
</head><body>
<nav class="navbar navbar-dark" style="background-color:#1B5E20">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="dashboard.html">⚙️ Admin — Agro Market</a>
    <div class="navbar-nav flex-row gap-3">
      <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
      <a class="nav-link text-white" href="productos.html">Productos</a>
      <a class="nav-link text-white" href="pedidos.html">Pedidos</a>
      <a class="nav-link text-white" href="../catalogo.html">Ver sitio</a>
      <a class="nav-link text-white" href="#" onclick="cerrarSesion()">Salir</a>
    </div>
  </div>
</nav>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-success mb-0">🌿 Productos</h4>
    <button 
    class="btn btn-success"
    data-bs-toggle="modal"
    data-bs-target="#modalNuevo"
    onclick="prepararNuevoProducto()">
    <i class="bi bi-plus-lg"></i> Nuevo producto
    </button>
  </div>
  <div class="card shadow-sm border-0">
    <div id="tabla-productos">
      <div class="p-4 text-center"><div class="spinner-border text-success"></div></div>
    </div>
  </div>
</div>

<!-- Modal nuevo producto -->
<div class="modal fade" id="modalNuevo" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header bg-success text-white">
      <h5 class="modal-title">Nuevo Producto</h5>
      <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
      <div class="mb-3">
        <label class="form-label">Nombre *</label>
        <input type="text" id="np-nombre" class="form-control">
      </div>
      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="form-label">Precio *</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" id="np-precio" class="form-control" step="0.01" min="0">
          </div>
        </div>
        <div class="col-6">
          <label class="form-label">Unidad</label>
          <select id="np-unidad" class="form-select">
            <option value="unidad">Unidad</option>
            <option value="kg">Kilogramo (kg)</option>
            <option value="lb">Libra (lb)</option>
            <option value="manojo">Manojo</option>
            <option value="docena">Docena</option>
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Stock inicial</label>
        <input type="number" id="np-stock" class="form-control" value="0" min="0">
      </div>
      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea id="np-desc" class="form-control" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      <button class="btn btn-success" onclick="guardarProducto()">Guardar</button>
    </div>
  </div></div>
</div>

<!-- Formulario de movimiento de stock -->
<div class="modal fade" id="modalStock" tabindex="-1"
     aria-labelledby="titulo-modal-stock" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="titulo-modal-stock">
          Movimiento de stock
        </h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <form id="form-stock">
        <div class="modal-body">
          <p class="fw-bold mb-1" id="stock-producto-nombre"></p>
          <p class="text-muted" id="stock-producto-disponible"></p>

          <div class="mb-3">
            <label for="stock-tipo" class="form-label">Tipo</label>
            <select id="stock-tipo" class="form-select" required>
              <option value="entrada">Entrada: aumentar existencias</option>
              <option value="salida">Salida: reducir existencias</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="stock-cantidad" class="form-label">Cantidad</label>
            <input type="number" id="stock-cantidad"
                   class="form-control"
                   min="0.001" step="0.001" required>
          </div>

          <div class="mb-3">
            <label for="stock-motivo" class="form-label">Motivo</label>
            <textarea id="stock-motivo" class="form-control"
                      rows="2" maxlength="300" required></textarea>
          </div>

          <div id="stock-error" class="alert alert-danger d-none"
               role="alert"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary"
                  data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-success"
                  id="btn-guardar-stock">
            Registrar movimiento
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="modalHistorialStock" tabindex="-1"
     aria-labelledby="titulo-historial-stock" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="titulo-historial-stock">
          Historial de stock
        </h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <p id="historial-producto-nombre" class="fw-bold"></p>
        <div id="historial-stock-contenido" class="table-responsive"></div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary"
                data-bs-dismiss="modal">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/db.js"></script>
<script>

  let productoEnEdicion = null;

function prepararNuevoProducto() {
  productoEnEdicion = null;

  document.querySelector("#modalNuevo .modal-title").textContent =
    "Nuevo producto";

  document.getElementById("np-nombre").value = "";
  document.getElementById("np-precio").value = "";
  document.getElementById("np-unidad").value = "unidad";
  document.getElementById("np-stock").value = "0";
  document.getElementById("np-stock").disabled = false;
  document.getElementById("np-desc").value = "";
}

async function editarProducto(id) {
  try {
    const producto = await obtenerProducto(id);

    if (!producto) {
      throw new Error("El producto ya no existe.");
    }

    prepararNuevoProducto();
    productoEnEdicion = id;

    document.querySelector("#modalNuevo .modal-title").textContent =
      "Editar producto";

    document.getElementById("np-nombre").value = producto.nombre;
    document.getElementById("np-precio").value = producto.precio;
    document.getElementById("np-unidad").value = producto.unidad;
    document.getElementById("np-desc").value =
      producto.descripcion ?? "";

    document.getElementById("np-stock").value =
      producto.stock_actual ?? 0;
    document.getElementById("np-stock").disabled = true;

    bootstrap.Modal.getOrCreateInstance(
      document.getElementById("modalNuevo")
    ).show();
  } catch (error) {
    console.error("Error al abrir el producto:", error);
    mostrarToast("No se pudo abrir el producto para editar.", "danger");
  }
}

  protegerPagina(["administrador"]);

  async function iniciarPagina() {
    cargarNavbar();
    cargarProductos();
  }

  async function cargarProductos() {
    const snap = await db.collection("productos").orderBy("nombre").get();
    const prods = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const el = document.getElementById("tabla-productos");

    if (!prods.length) {
      el.innerHTML = `<p class="text-center text-muted p-4">
        No hay productos. Agrega el primero.</p>`;
      return;
    }

    el.innerHTML = `<table class="table mb-0 align-middle">
      <thead class="table-success">
        <tr><th>Producto</th><th>Precio</th><th class="text-center">Stock</th>
            <th class="text-center">Estado</th>
            <th class="text-center">Acciones</th>
            </tr>
      </thead>
      <tbody>
        ${prods.map(p => `<tr>
          <td>
            <div class="fw-semibold">${p.nombre}</div>
            <small class="text-muted">${p.descripcion || ""}</small>
          </td>
          <td class="fw-bold text-success">${fmt(p.precio)} /${p.unidad}</td>
          <td class="text-center ${(p.stock_actual||0)<=0?"text-danger fw-bold":""}">
            ${p.stock_actual ?? 0}
          </td>
          <td class="text-center">
            <span class="badge bg-${p.activo?"success":"secondary"}">
              ${p.activo ? "Activo" : "Inactivo"}
            </span>
          </td>
          <td class="text-center">
            <button
            type="button"
            class="btn btn-sm btn-outline-${p.activo ? "danger" : "success"}"
            onclick="cambiarVisibilidadProducto('${p.id}', ${!p.activo}, this)">
            ${p.activo ? "Desactivar" : "Reactivar"}
            </button>

            <button
            type="button"
            class="btn btn-sm btn-outline-primary me-1"
            onclick="editarProducto('${p.id}')">
            editar
            </button>

            <button
              type="button"
              class="btn btn-sm btn-outline-secondary"
              onclick="abrirMovimientoStock('${p.id}')">
              Stock
            </button>

            <button
              type="button"
              class="btn btn-sm btn-outline-info"
              onclick="abrirHistorialStock('${p.id}')">
              Historial
            </button>

          </td>
        </tr>`).join("")}
      </tbody>
    </table>`;
  }


  async function cambiarVisibilidadProducto(id, activo, boton) {
  boton.disabled = true;

  try {
    await cambiarEstadoActivoProducto(id, activo);
    await cargarProductos();

    mostrarToast(
      activo ? "Producto reactivado." : "Producto desactivado."
    );
  } catch (error) {
    console.error("Error al cambiar el estado del producto:", error);
    mostrarToast("No se pudo cambiar el estado.", "danger");
  } finally {
    boton.disabled = false;
  }
}

async function guardarProducto() {
  const boton = document.querySelector(
    '#modalNuevo button[onclick="guardarProducto()"]'
  );

  boton.disabled = true;

  try {
    const datos = {
      nombre: document.getElementById("np-nombre").value,
      precio: document.getElementById("np-precio").value,
      unidad: document.getElementById("np-unidad").value,
      descripcion: document.getElementById("np-desc").value
    };

    const editando = productoEnEdicion !== null;

    if (editando) {
      await actualizarProducto(productoEnEdicion, datos);
    } else {
      const stockTexto = document.getElementById("np-stock").value;

      if (!stockTexto.trim()) {
        throw new Error("Ingresa el stock inicial.");
      }

      await crearProducto({
        ...datos,
        stock_actual: Number(stockTexto)
      });
    }

    bootstrap.Modal.getInstance(
      document.getElementById("modalNuevo")
    ).hide();

    prepararNuevoProducto();

    mostrarToast(
      editando ? "Producto actualizado." : "Producto creado."
    );
  } catch (error) {
    console.error("Error al guardar el producto:", error);

    mostrarToast(
      error.code
        ? "No se pudo guardar el producto."
        : error.message,
      "danger"
    );
    return;
  } finally {
    boton.disabled = false;
  }

  try {
    await cargarProductos();
  } catch (error) {
    console.error("Error al actualizar la tabla:", error);
    mostrarToast(
      "El producto se guardó, pero debes recargar la tabla.",
      "warning"
    );
  }
}

function validarDatosProducto(datos) {
  const nombre = datos.nombre.trim();
  const descripcion = datos.descripcion.trim();
  const precio = Number(datos.precio);
  const unidades = ["unidad", "kg", "lb", "manojo", "docena"];

  if (!nombre || nombre.length > 100) {
    throw new Error("El nombre debe tener entre 1 y 100 caracteres.");
  }

  if (!Number.isFinite(precio) || precio <= 0) {
    throw new Error("Ingresa un precio válido mayor que cero.");
  }

  if (!unidades.includes(datos.unidad)) {
    throw new Error("Selecciona una unidad válida.");
  }

  if (descripcion.length > 1000) {
    throw new Error("La descripción admite hasta 1000 caracteres.");
  }

  return {
    nombre,
    descripcion,
    precio: Math.round(precio * 100) / 100,
    unidad: datos.unidad
  };
}

async function crearProducto(datos) {
  const producto = validarDatosProducto(datos);
  const stock = Number(datos.stock_actual);

  if (!Number.isFinite(stock) || stock < 0) {
    throw new Error("El stock debe ser un número mayor o igual a cero.");
  }

  return db.collection("productos").add({
    ...producto,
    stock_actual: stock,
    activo: true,
    created_at: firebase.firestore.FieldValue.serverTimestamp()
  });
}

async function actualizarProducto(id, datos) {
  const producto = validarDatosProducto(datos);

  await db.collection("productos").doc(id).update({
    ...producto,
    updated_at: firebase.firestore.FieldValue.serverTimestamp()
  });
}

let productoStockId = null;
let guardandoStock = false;

async function abrirMovimientoStock(id) {
  try {
    const producto = await obtenerProducto(id);

    if (!producto) {
      throw new Error("El producto ya no existe.");
    }

    productoStockId = id;

    document.getElementById("form-stock").reset();

    const error = document.getElementById("stock-error");
    error.textContent = "";
    error.classList.add("d-none");

    document.getElementById("stock-producto-nombre").textContent =
      producto.nombre;

    document.getElementById("stock-producto-disponible").textContent =
      `Disponible: ${producto.stock_actual ?? 0} ${producto.unidad}`;

    bootstrap.Modal.getOrCreateInstance(
      document.getElementById("modalStock")
    ).show();
  } catch (error) {
    console.error("Error al abrir el movimiento:", error);
    mostrarToast("No se pudo cargar el producto.", "danger");
  }
}

document.getElementById("form-stock").addEventListener(
  "submit",
  guardarMovimientoStock
);

// Evitar cerrar el formulario mientras se está guardando.
document.getElementById("modalStock").addEventListener(
  "hide.bs.modal",
  evento => {
    if (guardandoStock) {
      evento.preventDefault();
    }
  }
);

async function guardarMovimientoStock(evento) {
  evento.preventDefault();

  if (guardandoStock || !productoStockId) return;

  const boton = document.getElementById("btn-guardar-stock");
  const errorVisible = document.getElementById("stock-error");

  guardandoStock = true;
  boton.disabled = true;
  errorVisible.classList.add("d-none");

  let nuevoStock;

  try {
    nuevoStock = await registrarMovimientoStock(
      productoStockId,
      document.getElementById("stock-tipo").value,
      document.getElementById("stock-cantidad").value,
      document.getElementById("stock-motivo").value
    );
  } catch (error) {
    console.error("Error al registrar el movimiento:", error);

    errorVisible.textContent = error.code
      ? "No se pudo guardar. Revisa tu conexión y tus permisos."
      : error.message;

    errorVisible.classList.remove("d-none");
    return;
  } finally {
    guardandoStock = false;
    boton.disabled = false;
  }

  bootstrap.Modal.getInstance(
    document.getElementById("modalStock")
  ).hide();

  productoStockId = null;

  mostrarToast(`Movimiento registrado. Nuevo stock: ${nuevoStock}.`);

  try {
    await cargarProductos();
  } catch (error) {
    console.error("Error al actualizar la tabla:", error);
    mostrarToast(
      "El movimiento se guardó. Recarga para ver el nuevo stock.",
      "warning"
    );
  }
}

let solicitudHistorial = 0;

async function abrirHistorialStock(productoId) {
  const solicitudActual = ++solicitudHistorial;
  const contenido = document.getElementById("historial-stock-contenido");
  const nombre = document.getElementById("historial-producto-nombre");

  nombre.textContent = "";
  contenido.textContent = "Cargando movimientos...";

  bootstrap.Modal.getOrCreateInstance(
    document.getElementById("modalHistorialStock")
  ).show();

  try {
    const [producto, movimientos] = await Promise.all([
      obtenerProducto(productoId),
      listarMovimientosProducto(productoId)
    ]);

    // Evitar mostrar una respuesta anterior si se abrió otro producto.
    if (solicitudActual !== solicitudHistorial) return;

    nombre.textContent = producto?.nombre ?? "Producto no disponible";
    mostrarHistorialStock(movimientos);
  } catch (error) {
    if (solicitudActual !== solicitudHistorial) return;

    console.error("Error al cargar el historial:", error);
    contenido.textContent = "No se pudo cargar el historial.";
  }
}

function mostrarHistorialStock(movimientos) {
  const contenido = document.getElementById("historial-stock-contenido");
  contenido.replaceChildren();

  if (!movimientos.length) {
    contenido.textContent = "Este producto todavía no tiene movimientos.";
    return;
  }

  const tabla = document.createElement("table");
  tabla.className = "table table-sm align-middle";

  const encabezado = tabla.createTHead().insertRow();

  ["Fecha", "Tipo", "Cantidad", "Anterior", "Nuevo", "Motivo"]
    .forEach(titulo => {
      const celda = document.createElement("th");
      celda.textContent = titulo;
      encabezado.appendChild(celda);
    });

  const cuerpo = tabla.createTBody();

  movimientos.forEach(movimiento => {
    const fila = cuerpo.insertRow();

    const fecha = movimiento.created_at?.toDate().toLocaleString(
      "es-EC",
      { timeZone: "America/Guayaquil" }
    ) ?? "Fecha pendiente";

    const valores = [
      fecha,
      movimiento.tipo === "entrada" ? "Entrada" : "Salida",
      movimiento.cantidad,
      movimiento.stock_anterior,
      movimiento.stock_nuevo,
      movimiento.motivo
    ];

    valores.forEach(valor => {
      fila.insertCell().textContent = String(valor ?? "");
    });
  });

  contenido.appendChild(tabla);
}

</script>
</body></html>

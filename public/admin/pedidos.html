<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pedidos — Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head><body>
<nav class="navbar navbar-dark bg-success"><div class="container-fluid">
  <a class="navbar-brand fw-bold" href="dashboard.html">Admin — Agro Market</a>
  <div class="d-flex flex-wrap gap-3">
    <a class="text-white" href="dashboard.html">Dashboard</a><a class="text-white" href="productos.html">Productos</a>
    <a class="text-white" href="pedidos.html">Pedidos</a><a class="text-white" href="usuarios.html">Usuarios</a>
    <a class="text-white" href="../catalogo.html">Ver sitio</a><button class="btn btn-sm btn-outline-light" onclick="cerrarSesion()">Salir</button>
  </div>
</div></nav>
<main class="container py-4">
  <h1 class="h4 text-success">Pedidos</h1>
  <div class="d-flex gap-2 my-3">
    <label for="filtro-estado" class="visually-hidden">Filtrar por estado</label>
    <select id="filtro-estado" class="form-select" style="max-width:250px">
      <option value="">Todos los estados</option><option value="pendiente">Pendiente</option>
      <option value="confirmado">Confirmado</option><option value="en_preparacion">En preparación</option>
      <option value="en_camino">En camino</option><option value="listo_para_retirar">Listo para retirar</option>
      <option value="entregado">Entregado</option><option value="cancelado">Cancelado</option>
    </select>
    <button id="actualizar" class="btn btn-outline-success">Actualizar</button>
  </div>
  <div id="error-pedidos" class="alert alert-danger d-none" role="alert"></div>
  <div id="tabla-pedidos" aria-live="polite">Cargando pedidos...</div>
</main>
<script src="../js/firebase-config.js"></script><script src="../js/auth.js"></script><script src="../js/db.js"></script>
<script>
  let pedidos = [];
  let repartidores = [];
  let ocupado = false;
  const colores = {pendiente:"warning", confirmado:"info", en_preparacion:"primary", en_camino:"secondary", entregado:"success", cancelado:"danger", listo_para_retirar:"info"};
  function nodo(tag, clase = "", texto = "") {
    const el = document.createElement(tag); el.className = clase; el.textContent = texto; return el;
  }
  async function iniciarPagina() { await cargarPedidos(); }
  async function cargarPedidos() {
    if (ocupado) return;
    ocupado = true;
    bloquear(true);
    const error = document.getElementById("error-pedidos"); error.classList.add("d-none");
    try {
      const [resultado, conductores] = await Promise.all([db.collection("pedidos").get(), listarRepartidoresActivos()]);
      pedidos = resultado.docs.map(doc => ({ ...doc.data(), id: doc.id }))
        .sort((a,b) => (b.created_at?.toMillis() ?? 0) - (a.created_at?.toMillis() ?? 0));
      repartidores = conductores;
      renderizarPedidos();
    } catch (e) {
      console.error(e); error.textContent = "No se pudieron cargar los pedidos o repartidores. Revisa la consola y pulsa Actualizar.";
      error.classList.remove("d-none");
    } finally { ocupado = false; bloquear(false); }
  }
  function bloquear(valor) {
    document.querySelectorAll("main button, main select").forEach(el => { el.disabled = valor; });
  }
  function renderizarPedidos() {
    const contenedor = document.getElementById("tabla-pedidos"); contenedor.replaceChildren();
    const estado = document.getElementById("filtro-estado").value;
    const visibles = pedidos.filter(p => !estado || p.estado === estado);
    if (!visibles.length) { contenedor.append(nodo("p", "text-muted", "No hay pedidos para este filtro.")); return; }
    for (const pedido of visibles) {
      const tarjeta = nodo("article", "card shadow-sm mb-3");
      const cuerpo = nodo("div", "card-body");
      cuerpo.append(nodo("h2", "h6", `Pedido #${pedido.id}`), nodo("span", `badge bg-${colores[pedido.estado] || "secondary"}`, ETIQUETAS_ESTADO[pedido.estado] || pedido.estado));
      cuerpo.append(nodo("p", "mt-2 mb-1", `${pedido.cliente_nombre || pedido.cliente_id} · ${pedido.tipo === "delivery" ? "Delivery" : "Retiro"} · ${fmt(pedido.total)}`));
      cuerpo.append(nodo("p", "text-muted small", pedido.created_at?.toDate?.()?.toLocaleString("es-EC") || "Fecha pendiente"));
      if (pedido.tipo === "delivery") {
        cuerpo.append(nodo("p", "mb-1", `${pedido.zona_nombre || "Zona"}: ${pedido.direccion_entrega || "Sin dirección"}`));
        cuerpo.append(nodo("p", "small", `Envío: ${fmt(pedido.tarifa_envio)} · Pago: ${pedido.forma_pago}`));
        if (pedido.repartidor_nombre) cuerpo.append(nodo("p", "mb-2", `Repartidor: ${pedido.repartidor_nombre}`));
      }
      if (pedido.notas) cuerpo.append(nodo("p", "small", `Observaciones: ${pedido.notas}`));
      const lista = nodo("ul", "small");
      for (const detalle of pedido.detalles || []) lista.append(nodo("li", "", `${detalle.nombre_producto}: ${detalle.cantidad} ${detalle.unidad} — ${fmt(detalle.subtotal)}`));
      cuerpo.append(lista);
      const acciones = nodo("div", "d-flex flex-wrap align-items-center gap-2");
      let siguientes = obtenerTransicionesPedido(pedido);
      // La entrega de delivery la confirma el repartidor desde su panel.
      if (pedido.tipo === "delivery") siguientes = siguientes.filter(e => e !== "entregado");
      let seleccion = null;
      if (pedido.tipo === "delivery" && pedido.estado === "en_preparacion") {
        seleccion = nodo("select", "form-select w-auto");
        seleccion.setAttribute("aria-label", `Repartidor para el pedido ${pedido.id}`);
        const inicial = nodo("option", "", "Selecciona un repartidor"); inicial.value = ""; seleccion.append(inicial);
        for (const repartidor of repartidores) {
          const opcion = nodo("option", "", `${repartidor.nombre} ${repartidor.apellido}`);
          opcion.value = repartidor.id; seleccion.append(opcion);
        }
        acciones.append(seleccion);
        if (!repartidores.length) cuerpo.append(nodo("p", "text-danger small", "Crea primero un repartidor desde Usuarios."));
      }
      for (const siguiente of siguientes) {
        const boton = nodo("button", "btn btn-success btn-sm", `Pasar a ${ETIQUETAS_ESTADO[siguiente]}`); boton.type = "button";
        boton.addEventListener("click", () => ejecutar(() => cambiarEstado(pedido.id, pedido, siguiente, "", seleccion?.value || null), "Estado actualizado."));
        acciones.append(boton);
      }
      if (["pendiente", "confirmado"].includes(pedido.estado)) {
        const boton = nodo("button", "btn btn-outline-danger btn-sm", "Cancelar pedido"); boton.type = "button";
        boton.addEventListener("click", () => {
          if (ocupado) return;
          const motivo = window.prompt("Motivo de cancelación (1 a 288 caracteres):");
          if (motivo === null) return;
          if (!motivo.trim() || motivo.trim().length > 288) { mostrarToast("Escribe un motivo de 1 a 288 caracteres.", "warning"); return; }
          ejecutar(() => cancelarPedido(pedido.id, motivo), "Pedido cancelado. El stock se devuelve una sola vez.");
        });
        acciones.append(boton);
      }
      if (pedido.tipo === "delivery" && pedido.estado === "en_camino") cuerpo.append(nodo("p", "text-muted small", "En espera de confirmación del repartidor."));
      cuerpo.append(acciones); tarjeta.append(cuerpo); contenedor.append(tarjeta);
    }
  }
  async function ejecutar(operacion, mensaje) {
    if (ocupado) return;
    ocupado = true; bloquear(true);
    try { await operacion(); mostrarToast(mensaje); }
    catch (error) { console.error(error); mostrarToast(error.code ? "No se pudo guardar. Actualiza la lista y revisa la consola." : error.message, "danger"); }
    finally { ocupado = false; bloquear(false); await cargarPedidos(); }
  }
  document.getElementById("actualizar").addEventListener("click", cargarPedidos);
  document.getElementById("filtro-estado").addEventListener("change", renderizarPedidos);
  protegerPagina(["administrador"]);
</script>
</body></html>

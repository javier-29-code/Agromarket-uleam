<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mis Pedidos — Agro Market ULEAM</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head><body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#1B5E20">
  <div class="container">
    <a class="navbar-brand fw-bold" href="catalogo.html">🌱 Agro Market ULEAM</a>
    <div class="navbar-nav ms-auto flex-row flex-wrap gap-3 align-items-center">
      <a class="nav-link text-white" href="mis-pedidos.html">Mis pedidos</a>
      <a class="nav-link text-white" href="catalogo.html">Catálogo</a>
      <span id="usuario-nombre" class="text-white"></span>
      <button class="btn btn-sm btn-outline-light" type="button" onclick="cerrarSesion()">Salir</button>
    </div>
  </div>
</nav>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 fw-bold text-success mb-0">📦 Mis pedidos</h1>
    <button id="reintentar-pedidos" type="button" class="btn btn-outline-success btn-sm">Reconectar</button>
  </div>
  <p class="text-muted small">Los cambios de estado y los tiempos estimados se actualizan automáticamente mientras esta página está abierta.</p>
  <div id="cancelacion-resultado" class="d-none" role="status" aria-live="polite"></div>
  <div id="pedidos-error" class="alert alert-danger d-none" role="alert"></div>
  <div id="lista-pedidos" aria-live="polite"><p>Cargando pedidos...</p></div>
</main>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/db.js"></script>
<script>
  let detenerPedidos = null;
  let versionEscucha = 0;
  let pedidosActuales = new Map();
  const historialesAbiertos = new Set();
  let temporizadorEstimaciones = null;
  const pedidosCancelandose = new Set();

  function detenerActualizaciones() {
    versionEscucha++;
    detenerPedidos?.(); detenerPedidos = null;
    if (temporizadorEstimaciones) clearInterval(temporizadorEstimaciones);
    temporizadorEstimaciones = null;
  }

  async function iniciarPagina() {
    detenerActualizaciones();
    const version = versionEscucha;
    const usuario = auth.currentUser;
    if (!usuario) return;
    const aviso = document.getElementById("pedidos-error");
    const contenedor = document.getElementById("lista-pedidos");
    aviso.classList.add("d-none");
    try {
      await cargarNavbar();
      if (auth.currentUser?.uid !== usuario.uid || version !== versionEscucha) return;
      detenerPedidos = escucharPedidosCliente(usuario.uid, pedidos => {
        if (auth.currentUser?.uid !== usuario.uid || version !== versionEscucha) return;
        aviso.classList.add("d-none");
        pedidosActuales = new Map(pedidos.map(pedido => [pedido.id, pedido]));
        contenedor.replaceChildren();
        if (!pedidos.length) contenedor.textContent = "Todavía no tienes pedidos.";
        else pedidos.forEach(pedido => contenedor.appendChild(crearTarjetaPedido(pedido)));
        actualizarEstimaciones();
      }, error => {
        if (auth.currentUser?.uid !== usuario.uid || version !== versionEscucha) return;
        console.error("Error al escuchar pedidos:", error);
        aviso.textContent = "Se interrumpió la consulta de pedidos. Los datos visibles pueden estar desactualizados. Revisa tu conexión y pulsa Reconectar.";
        aviso.classList.remove("d-none");
        if (!pedidosActuales.size) contenedor.textContent = "No se pudieron cargar tus pedidos.";
      });
      temporizadorEstimaciones = setInterval(actualizarEstimaciones, 30000);
    } catch (error) {
      if (auth.currentUser?.uid !== usuario.uid || version !== versionEscucha) return;
      console.error("Error al cargar pedidos:", error);
      aviso.textContent = "No se pudieron cargar tus pedidos. Pulsa Reconectar para reintentar.";
      aviso.classList.remove("d-none");
    }
  }

  function textoPedido(etiqueta, clase, texto) {
    const elemento = document.createElement(etiqueta); elemento.className = clase; elemento.textContent = texto; return elemento;
  }
  function etiquetaEstadoPedido(estado) { return ETIQUETAS_ESTADO[estado] ?? estado; }
  function convertirFechaPedido(valor) {
    if (!valor) return null;
    if (typeof valor.toDate === "function") return valor.toDate();
    const fecha = valor instanceof Date ? valor : new Date(valor);
    return Number.isNaN(fecha.getTime()) ? null : fecha;
  }
  function formatearFechaPedido(valor) {
    const fecha = convertirFechaPedido(valor);
    return fecha ? fecha.toLocaleString("es-EC", { timeZone: "America/Guayaquil" }) : "Fecha pendiente";
  }
  function actualizarEstimaciones() {
    document.querySelectorAll("[data-estimacion-id]").forEach(elemento => {
      const pedido = pedidosActuales.get(elemento.dataset.estimacionId);
      if (!pedido) return;
      const estimacion = obtenerEstimacionEntrega(pedido);
      if (!estimacion) { elemento.textContent = "El repartidor todavía no ha comunicado un tiempo estimado."; return; }
      const hora = estimacion.llegadaAproximada.toLocaleTimeString("es-EC", { timeZone: "America/Guayaquil", hour: "2-digit", minute: "2-digit" });
      elemento.textContent = estimacion.vencida
        ? `La última estimación ya transcurrió (llegada aproximada: ${hora}). Espera una actualización del repartidor. El pedido continúa En camino.`
        : `Llegada aproximada: ${hora}. El repartidor comunicó ${estimacion.minutos} minutos el ${formatearFechaPedido(estimacion.actualizadaEn)}.`;
    });
  }
  function crearTarjetaPedido(pedido) {
    const colores = { pendiente:"warning", confirmado:"info", en_preparacion:"primary", listo_para_retirar:"info", en_camino:"secondary", entregado:"success", cancelado:"danger" };
    const tarjeta = textoPedido("article", "card shadow-sm mb-3", "");
    const cuerpo = textoPedido("div", "card-body", "");
    cuerpo.append(
      textoPedido("h2", "h6 fw-bold", `Pedido #${pedido.id}`),
      textoPedido("p", "text-muted small", formatearFechaPedido(pedido.created_at)),
      textoPedido("span", `badge bg-${colores[pedido.estado] ?? "secondary"}`, etiquetaEstadoPedido(pedido.estado)),
      textoPedido("p", "small mt-3", `Entrega: ${pedido.tipo === "retiro" ? "Retiro" : "Delivery"}. Pago: ${pedido.forma_pago === "efectivo" ? "Efectivo" : "Transferencia"}.`)
    );
    if (pedido.tipo === "delivery") {
      if (pedido.direccion_entrega) cuerpo.append(textoPedido("p", "small", `${pedido.zona_nombre || "Zona"}: ${pedido.direccion_entrega}`));
      if (pedido.repartidor_nombre) cuerpo.append(textoPedido("p", "small", `Repartidor: ${pedido.repartidor_nombre}`));
      if (pedido.estado === "en_camino") {
        const estimacion = textoPedido("p", "alert alert-info small", ""); estimacion.dataset.estimacionId = pedido.id; cuerpo.append(estimacion);
      }
    }
    const lista = textoPedido("ul", "list-group list-group-flush mb-3", "");
    for (const detalle of pedido.detalles ?? []) lista.append(textoPedido("li", "list-group-item px-0", `${detalle.nombre_producto}: ${detalle.cantidad} ${detalle.unidad ?? "unidad"} × ${fmt(detalle.precio_unitario)} = ${fmt(detalle.subtotal)}`));
    cuerpo.append(lista, textoPedido("p", "fw-bold text-success mb-0", `Total: ${fmt(pedido.total)}`));
    if (pedido.notas) cuerpo.append(textoPedido("p", "small mt-2 mb-0", `Observaciones: ${pedido.notas}`));
    if (pedido.estado === "cancelado" && pedido.forma_pago === "transferencia") {
      cuerpo.append(textoPedido("p", "alert alert-warning small mt-3", "La cancelación devuelve las existencias. Si realizaste la transferencia, coordina el reembolso con administración."));
    }
    if (puedeSolicitarCancelacionCliente(pedido)) {
      const boton = textoPedido("button", "btn btn-outline-danger btn-sm mt-3", "Cancelar pedido");
      boton.type = "button"; boton.dataset.cancelacionId = pedido.id;
      boton.disabled = pedidosCancelandose.has(pedido.id);
      boton.addEventListener("click", () => cancelarDesdeMisPedidos(pedido));
      cuerpo.append(boton, textoPedido("p", "text-muted small mt-1 mb-0", "Puedes cancelar mientras el pedido siga pendiente. Las existencias se devolverán automáticamente."));
    }
    cuerpo.append(crearHistorialPedido(pedido)); tarjeta.append(cuerpo); return tarjeta;
  }
  function actualizarBotonesCancelacion() {
    document.querySelectorAll("[data-cancelacion-id]").forEach(boton => {
      boton.disabled = pedidosCancelandose.has(boton.dataset.cancelacionId);
    });
  }
  async function cancelarDesdeMisPedidos(pedido) {
    if (pedidosCancelandose.has(pedido.id) || !puedeSolicitarCancelacionCliente(pedido)) return;
    const usuarioId = auth.currentUser.uid;
    const motivo = window.prompt("Motivo de cancelación (entre 1 y 287 caracteres):");
    if (motivo === null) return;
    const aviso = document.getElementById("cancelacion-resultado");
    if (!motivo.trim() || motivo.trim().length > 287) {
      aviso.className = "alert alert-warning";
      aviso.textContent = "Escribe un motivo de entre 1 y 287 caracteres."; return;
    }
    pedidosCancelandose.add(pedido.id); actualizarBotonesCancelacion();
    aviso.className = "alert alert-info"; aviso.textContent = "Cancelando pedido...";
    try {
      const cancelado = await cancelarPedidoCliente(pedido.id, motivo);
      if (auth.currentUser?.uid !== usuarioId) return;
      aviso.className = "alert alert-success";
      aviso.textContent = cancelado ? "Pedido cancelado y existencias devueltas." : "El pedido ya estaba cancelado.";
      if (pedido.forma_pago === "transferencia") aviso.textContent += " Si realizaste la transferencia, coordina el reembolso con administración.";
    } catch (error) {
      if (auth.currentUser?.uid !== usuarioId) return;
      console.error("Error al cancelar tu pedido:", error);
      aviso.className = "alert alert-danger";
      aviso.textContent = error.code
        ? "No se pudo confirmar la cancelación. Reconecta para consultar el estado y reintenta si continúa pendiente."
        : error.message;
    } finally { pedidosCancelandose.delete(pedido.id); actualizarBotonesCancelacion(); }
  }
  function crearHistorialPedido(pedido) {
    const contenedor = textoPedido("details", "mt-3", "");
    contenedor.open = historialesAbiertos.has(pedido.id);
    contenedor.addEventListener("toggle", () => {
      if (!contenedor.isConnected) return;
      if (contenedor.open) historialesAbiertos.add(pedido.id); else historialesAbiertos.delete(pedido.id);
    });
    const titulo = textoPedido("summary", "text-success", "Ver historial del pedido");
    const lista = textoPedido("ol", "mt-2 mb-0", "");
    function agregarEvento(titulo, fecha, nota = "") {
      const elemento = textoPedido("li", "mb-2", "");
      elemento.append(textoPedido("div", "fw-semibold", titulo), textoPedido("small", "text-muted d-block", formatearFechaPedido(fecha)));
      if (nota) elemento.append(textoPedido("p", "small mb-0", nota));
      lista.append(elemento);
    }
    agregarEvento("Pendiente", pedido.created_at, "Pedido registrado.");
    for (const evento of pedido.historial ?? []) {
      if (evento.tipo === "tiempo_estimado") agregarEvento(`Tiempo estimado: ${evento.minutos} minutos`, evento.fecha);
      else agregarEvento(etiquetaEstadoPedido(evento.estado_nuevo), evento.fecha,
        evento.estado_nuevo === "cancelado" ? `Motivo de cancelación: ${evento.nota ?? ""}` : evento.nota ?? "");
    }
    contenedor.append(titulo, lista); return contenedor;
  }
  document.getElementById("reintentar-pedidos").addEventListener("click", iniciarPagina);
  window.addEventListener("pagehide", detenerActualizaciones);
  window.addEventListener("pageshow", evento => { if (evento.persisted && auth.currentUser) iniciarPagina(); });
  protegerPagina(["cliente", "administrador"]);
</script>
</body></html>

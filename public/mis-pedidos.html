<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mis Pedidos — Agro Market ULEAM</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head><body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#1B5E20">
  <div class="container">
    <a class="navbar-brand fw-bold" href="catalogo.html">🌱 Agro Market ULEAM</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link text-white" href="mis-pedidos.html">
        <i class="bi bi-bag-check"></i> Mis Pedidos</a>
      <span class="nav-link text-white">
        <i class="bi bi-person-circle"></i> <span id="usuario-nombre"></span></span>
      <a class="nav-link text-white" href="#" onclick="cerrarSesion()">
        <i class="bi bi-box-arrow-right"></i> Salir</a>
    </div>
  </div>
</nav>
<div class="container py-4">
  <h4 class="fw-bold text-success mb-4">📦 Mis Pedidos</h4>
  <div id="lista-pedidos">
    <div class="text-center py-5">
      <div class="spinner-border text-success"></div>
    </div>
  </div>
</div>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
<script>
  async function iniciarPagina() {
    const contenedor = document.getElementById("lista-pedidos");

    try {
      await cargarNavbar();

      const usuario = auth.currentUser;
      if (!usuario) return;

      const pedidos = await listarPedidosCliente(usuario.uid);

      if (auth.currentUser?.uid !== usuario.uid) return;

      contenedor.replaceChildren();

      if (!pedidos.length) {
        contenedor.textContent = "Todavía no tienes pedidos.";
        return;
      }

      pedidos.forEach(pedido => {
        contenedor.appendChild(crearTarjetaPedido(pedido));
      });
    } catch (error) {
      console.error("Error al cargar pedidos:", error);
      contenedor.textContent =
        "No se pudieron cargar tus pedidos. Recarga para reintentar.";
    }
  }

  function textoPedido(etiqueta, clase, texto) {
    const elemento = document.createElement(etiqueta);
    elemento.className = clase;
    elemento.textContent = texto;
    return elemento;
  }

  function etiquetaEstadoPedido(estado) {
    return estado === "listo_para_retirar"
      ? "Listo para retirar"
      : (ETIQUETAS_ESTADO[estado] ?? estado);
  }

  function formatearFechaPedido(fecha) {
    if (!(fecha instanceof Date) || Number.isNaN(fecha.getTime())) {
      return "Fecha pendiente";
    }

    return fecha.toLocaleString("es-EC", {
      timeZone: "America/Guayaquil"
    });
  }

  function crearTarjetaPedido(pedido) {
    const colores = {
      pendiente: "warning",
      confirmado: "info",
      en_preparacion: "primary",
      listo_para_retirar: "info",
      en_camino: "secondary",
      entregado: "success",
      cancelado: "danger"
    };

    const tarjeta = document.createElement("article");
    tarjeta.className = "card shadow-sm mb-3";

    const cuerpo = document.createElement("div");
    cuerpo.className = "card-body";

    cuerpo.append(
      textoPedido("h2", "h6 fw-bold", `Pedido #${pedido.id}`),
      textoPedido(
        "p",
        "text-muted small",
        formatearFechaPedido(pedido.created_at?.toDate?.())
      ),
      textoPedido(
        "span",
        `badge bg-${colores[pedido.estado] ?? "secondary"} text-dark`,
        etiquetaEstadoPedido(pedido.estado)
      ),
      textoPedido(
        "p",
        "small mt-3",
        `Entrega: ${pedido.tipo === "retiro" ? "Retiro" : "Delivery"}. ` +
        `Pago: ${pedido.forma_pago === "efectivo"
          ? "Efectivo"
          : "Transferencia"}.`
      )
    );

    const lista = document.createElement("ul");
    lista.className = "list-group list-group-flush mb-3";

    (pedido.detalles ?? []).forEach(detalle => {
      lista.appendChild(
        textoPedido(
          "li",
          "list-group-item px-0",
          `${detalle.nombre_producto}: ` +
          `${detalle.cantidad} ${detalle.unidad ?? "unidad"} ` +
          `× ${fmt(detalle.precio_unitario)} = ${fmt(detalle.subtotal)}`
        )
      );
    });

    cuerpo.append(
      lista,
      textoPedido(
        "p",
        "fw-bold text-success mb-0",
        `Total: ${fmt(pedido.total)}`
      )
    );

    if (pedido.notas) {
      cuerpo.appendChild(
        textoPedido(
          "p",
          "small mt-2 mb-0",
          `Observaciones: ${pedido.notas}`
        )
      );
    }

    cuerpo.appendChild(crearHistorialPedido(pedido));
    tarjeta.appendChild(cuerpo);

    return tarjeta;
  }

  function crearHistorialPedido(pedido) {
    const contenedor = document.createElement("details");
    contenedor.className = "mt-3";

    const titulo = textoPedido(
      "summary",
      "text-success",
      "Ver historial del pedido"
    );

    const lista = document.createElement("ol");
    lista.className = "mt-2 mb-0";

    function agregarEvento(estado, fecha, nota = "") {
      const elemento = document.createElement("li");
      elemento.className = "mb-2";

      elemento.append(
        textoPedido(
          "div",
          "fw-semibold",
          etiquetaEstadoPedido(estado)
        ),
        textoPedido(
          "small",
          "text-muted d-block",
          formatearFechaPedido(fecha)
        )
      );

      if (nota) {
        elemento.appendChild(
          textoPedido(
            "p",
            "small mb-0",
            estado === "cancelado"
              ? `Motivo de cancelación: ${nota}`
              : nota
          )
        );
      }

      lista.appendChild(elemento);
    }

    agregarEvento(
      "pendiente",
      pedido.created_at?.toDate?.(),
      "Pedido registrado."
    );

    (pedido.historial ?? []).forEach(evento => {
      agregarEvento(
        evento.estado_nuevo,
        evento.fecha ? new Date(evento.fecha) : null,
        evento.nota ?? ""
      );
    });

    contenedor.append(titulo, lista);
    return contenedor;
  }

  protegerPagina(["cliente", "administrador"]);
</script>
</body></html>
